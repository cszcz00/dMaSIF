<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="40.0" y="52.0" font-size="24" fill="#1f2328" text-anchor="start" font-weight="bold">The dataset: PLINDER, filtered to a drug-like, pocket-consistent core, then widened for target diversity</text>
<text x="40.0" y="80.0" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">One row = one protein–ligand interaction from a PLINDER system. Target group = UniProt accession, the unit training samples and validation holds out.</text>
<rect x="40.0" y="105.0" width="450.0" height="76.0" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="56.0" y="131.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">1 · Source: PLINDER 2024-06 (v2)</text>
<text x="56.0" y="152.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">annotated protein–ligand systems with interaction</text>
<text x="56.0" y="169.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">clusters, UniProt, ligand classes, train / val / test split</text>
<text x="40.0" y="214.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">2 · A strict, drug-like core</text>
<text x="40.0" y="233.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">rows left after each group of filters</text>
<rect x="110.0" y="252.0" width="300.0" height="22.0" rx="3" fill="#c9dafb" stroke="none" stroke-width="1"/>
<text x="418.0" y="268.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">341,945</text>
<text x="40.0" y="268.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">100%</text>
<text x="110.0" y="294.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">usable small molecules (manifest)</text>
<text x="110.0" y="312.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">proper ligand; no ions, no crystallisation artifacts;</text>
<text x="110.0" y="328.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">RDKit-loadable</text>
<rect x="110.0" y="354.0" width="94.4" height="22.0" rx="3" fill="#c9dafb" stroke="none" stroke-width="1"/>
<text x="212.4" y="370.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">107,544</text>
<text x="40.0" y="370.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">31%</text>
<text x="110.0" y="396.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">drug-like</text>
<text x="110.0" y="414.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">not a cofactor, oligomer or covalent ligand;</text>
<text x="110.0" y="430.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">MW 200–800 Da</text>
<rect x="110.0" y="456.0" width="77.8" height="22.0" rx="3" fill="#c9dafb" stroke="none" stroke-width="1"/>
<text x="195.8" y="472.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">88,678</text>
<text x="40.0" y="472.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">26%</text>
<text x="110.0" y="498.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">reliable ligand</text>
<text x="110.0" y="516.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">coordinates correct; 3–50 protein contacts</text>
<rect x="110.0" y="542.0" width="19.7" height="22.0" rx="3" fill="#c9dafb" stroke="none" stroke-width="1"/>
<text x="137.7" y="558.0" font-size="15" fill="#1f2328" text-anchor="start" font-weight="bold">22,443</text>
<text x="40.0" y="558.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">7%</text>
<text x="110.0" y="584.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">consistent pocket</text>
<text x="110.0" y="602.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">one ligand chain, 5–100 pocket residues, complete and</text>
<text x="110.0" y="618.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">resolved, ≤ 2.5 Å, &lt; 25% crystal contacts, no altlocs</text>
<rect x="110.0" y="644.0" width="18.6" height="22.0" rx="3" fill="#2f6fdf" stroke="none" stroke-width="1"/>
<text x="136.6" y="660.0" font-size="15" fill="#2f6fdf" text-anchor="start" font-weight="bold">21,209</text>
<text x="40.0" y="660.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">6%</text>
<text x="110.0" y="686.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">deduplicated core</text>
<text x="110.0" y="704.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">one row per (interaction cluster, ligand): 2,605 targets,</text>
<text x="110.0" y="720.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">~67 training visits per target → memorisation</text>
<line x1="494.0" y1="470.0" x2="530.0" y2="470.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<text x="40.0" y="776.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">Clean but narrow: 6% of the usable rows and only</text>
<text x="40.0" y="793.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">2,605 targets, too few for retrieval to generalise.</text>
<text x="540.0" y="131.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">3 · Relax only where it adds new targets</text>
<text x="540.0" y="152.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">training target groups, each step added on top of the previous ones</text>
<text x="540.0" y="169.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">(symmetry copies removed first: one row per PDB entry, ligand and UniProt)</text>
<text x="540.0" y="210.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">core, symmetry copies removed</text>
<text x="540.0" y="227.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">about half of the core's training rows were symmetry copies</text>
<rect x="880.0" y="198.0" width="56.7" height="18.0" rx="3" fill="#2f6fdf" stroke="none" stroke-width="1"/>
<text x="944.7" y="212.0" font-size="13" fill="#2f6fdf" text-anchor="start" font-weight="bold">2,379</text>
<text x="540.0" y="262.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ pockets with alternate conformations</text>
<text x="540.0" y="279.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">one conformer is used anyway</text>
<rect x="880.0" y="250.0" width="56.7" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="936.7" y="250.0" width="5.0" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="949.7" y="264.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+210</tspan></text>
<text x="540.0" y="314.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ lower resolution</text>
<text x="540.0" y="331.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">≤ 3.5 Å, or ≤ 4.5 Å if the pocket is complete and rigid</text>
<rect x="880.0" y="302.0" width="61.7" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="941.7" y="302.0" width="19.5" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="969.1" y="316.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+818</tspan></text>
<text x="540.0" y="366.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ small buried ligands</text>
<text x="540.0" y="383.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">120–200 Da when ≥ 90% buried; MW now up to 900 Da</text>
<rect x="880.0" y="354.0" width="81.1" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="961.1" y="354.0" width="29.1" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="998.3" y="368.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+1,223</tspan></text>
<text x="540.0" y="418.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ covalent ligands</text>
<text x="540.0" y="435.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">glycosylation (sugars on Asn) excluded</text>
<rect x="880.0" y="406.0" width="110.3" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="990.3" y="406.0" width="5.1" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="1003.4" y="420.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+216</tspan></text>
<text x="540.0" y="470.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ small oligomers</text>
<text x="540.0" y="487.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">≤ 60 heavy atoms: short peptides, small sugars</text>
<rect x="880.0" y="458.0" width="115.4" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="995.4" y="458.0" width="28.5" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="1031.9" y="472.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+1,196</tspan></text>
<text x="540.0" y="522.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ systems with small companions</text>
<text x="540.0" y="539.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">extra chains allowed if each ≤ 6 heavy atoms (ions, SO₄, glycerol)</text>
<rect x="880.0" y="510.0" width="143.9" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="1023.9" y="510.0" width="29.4" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="1061.3" y="524.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+1,235</tspan></text>
<text x="540.0" y="574.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">+ cofactors as targets</text>
<text x="540.0" y="591.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">HEM, FAD, NAD(P), SAH, nucleotides, ...</text>
<rect x="880.0" y="562.0" width="173.3" height="18.0" rx="3" fill="#c4e8d8" stroke="none" stroke-width="1"/>
<rect x="1053.3" y="562.0" width="26.8" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<text x="1088.1" y="576.0" font-size="13" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">+1,127</tspan></text>
<text x="1088.0" y="594.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">= 8,398</text>
<line x1="540.0" y1="606.0" x2="1140.0" y2="606.0" stroke="#d0d7de" stroke-width="1"/>
<text x="540.0" y="630.0" font-size="14" fill="#e07b1a" text-anchor="start" font-weight="bold">Hub control</text>
<text x="540.0" y="647.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">≤ 50 training rows per ligand, spread one per target first;</text>
<text x="540.0" y="662.0" font-size="12" fill="#59636e" text-anchor="start" font-weight="normal">detergents excluded (they passed PLINDER's artifact flag)</text>
<rect x="880.0" y="618.0" width="188.1" height="18.0" rx="3" fill="#2a9d6f" stroke="none" stroke-width="1"/>
<rect x="1068.1" y="618.0" width="11.9" height="18.0" rx="3" fill="none" stroke="#e07b1a" stroke-width="1.2"/>
<text x="1088.0" y="632.0" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">7,897 targets</text>
<text x="540.0" y="694.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">Uncapped, cofactors alone would add +3,813 targets but bring a few dominant</text>
<text x="540.0" y="709.0" font-size="12" fill="#8c959f" text-anchor="start" font-weight="normal">ligands (HEM 2,896 rows, GDP 1,009, ADP 976): the cap keeps the targets, not the hubs.</text>
<line x1="1162.0" y1="470.0" x2="1194.0" y2="470.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1200.0" y="105.0" width="360.0" height="760.0" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="1220.0" y="140.0" font-size="18" fill="#1f2328" text-anchor="start" font-weight="bold">4 · The dataset</text>
<text x="1220.0" y="160.0" font-size="12.5" fill="#59636e" text-anchor="start" font-weight="normal">(dataset_v2, built 2026-10-30)</text>
<text x="1220.0" y="214.0" font-size="34" fill="#1f2328" text-anchor="start" font-weight="bold">35,407</text>
<text x="1220.0" y="236.0" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">protein–ligand interactions</text>
<text x="1220.0" y="288.0" font-size="34" fill="#1f2328" text-anchor="start" font-weight="bold">34,808</text>
<text x="1220.0" y="310.0" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">receptor structures</text>
<text x="1220.0" y="362.0" font-size="34" fill="#1f2328" text-anchor="start" font-weight="bold">20,555</text>
<text x="1220.0" y="384.0" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">distinct ligands</text>
<text x="1220.0" y="436.0" font-size="34" fill="#2a9d6f" text-anchor="start" font-weight="bold">7,895</text>
<text x="1220.0" y="458.0" font-size="14" fill="#59636e" text-anchor="start" font-weight="normal">training target groups</text>
<line x1="1220.0" y1="492.0" x2="1540.0" y2="492.0" stroke="#d0d7de" stroke-width="1"/>
<text x="1220.0" y="516.0" font-size="14" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">3× </tspan><tspan fill="#1f2328" font-weight="normal">the core's 2,605 targets</tspan></text>
<text x="1220.0" y="538.0" font-size="14" text-anchor="start"><tspan fill="#2a9d6f" font-weight="bold">67 → 20 </tspan><tspan fill="#1f2328" font-weight="normal">training visits per target</tspan></text>
<text x="1220.0" y="560.0" font-size="14" text-anchor="start"><tspan fill="#e07b1a" font-weight="bold">≤ 50 </tspan><tspan fill="#1f2328" font-weight="normal">rows for any one ligand</tspan></text>
<line x1="1220.0" y1="578.0" x2="1540.0" y2="578.0" stroke="#d0d7de" stroke-width="1"/>
<text x="1220.0" y="600.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Splits</text>
<text x="1220.0" y="620.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">PLINDER train 34,316 · val 356 · test 735</text>
<text x="1220.0" y="640.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">Model selection: a fixed validation set of</text>
<text x="1220.0" y="658.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">400 rows over 240 targets, UniProt-disjoint</text>
<text x="1220.0" y="676.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">from training (7,644 targets, 31,861 rows)</text>
<line x1="1220.0" y1="694.0" x2="1540.0" y2="694.0" stroke="#d0d7de" stroke-width="1"/>
<text x="1220.0" y="716.0" font-size="14" fill="#1f2328" text-anchor="start" font-weight="bold">Per receptor, precomputed</text>
<text x="1220.0" y="736.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">dMaSIF surface + atom features,</text>
<text x="1220.0" y="754.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">fpocket pockets, PLIP interaction labels</text>
<text x="1220.0" y="772.0" font-size="13" fill="#59636e" text-anchor="start" font-weight="normal">(all training receptors but one)</text>
<text x="40.0" y="884.0" font-size="11.5" fill="#8c959f" text-anchor="start" font-weight="normal">Step gains in 3 are from the dataset funnel's ladder before the final per-ligand cap; the hub-control row is the built result. Sources: docs/RESULTS.md (funnel runs 1, 3, 4; dataset_v2 built).</text>
</svg>
