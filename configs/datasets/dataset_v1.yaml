# Clean baseline: every build_manifest.py filter + dedup (strict_rep), and only
# systems with exactly one ligand chain, since the ligand encoder takes one
# molecule per interaction.
description: >
  strict_rep rows (all build_manifest filters + dedup on
  pli_unique_qcov__95__strong__component and ligand) restricted to systems with
  a single ligand chain of any kind; PLINDER receptor as input.

manifest: meta/manifest.parquet
fingerprints: meta/ligand_fps.npy

selection:
  splits: [train, val, test]
  require: [strict_rep]
  exclude: []
  # n_ligand_chains counts every ligand chain in the system, ions and other
  # non-proper ligands included. strict_rep only guarantees ONE PROPER ligand.
  query: "n_ligand_chains == 1"
  dedup: null            # strict_rep is already deduplicated

receptor_input:
  policy: plinder_receptor
  params: {}
