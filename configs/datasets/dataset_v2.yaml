# DRAFT - build only after the third funnel run (RESULTS) confirms the
# numbers. Mirrors dataset_funnel.py's LADDER_SCAN; change both together.
#
# dataset_v1 + more distinct targets (the v3c+ memorisation ceiling).
# Relative to dataset_v1:
#   - altlocs filter dropped (extract.py keeps one conformer anyway)
#   - resolution <= 3.5 A, or <= 4.5 A with a complete pocket (<= 2 missing
#     heavy atoms) that is not unusually mobile (pocket B ratio <= 1.5)
#   - MW 200-900; 120-200 Da fragments only when buried (burial45 >= 0.9)
#   - covalent ligands, EXCEPT glycosylation (covalent and sugar-only)
#   - oligomers up to 60 heavy atoms (short peptides, small sugars)
#   - companion ligand chains up to 6 heavy atoms (ions, sulfate, glycerol);
#     every companion sits within ~4 A of the ligand, so size is the gate
#   - cofactors as targets
#   - detergents excluded (build_dataset.DETERGENTS)
#   - at most 50 TRAIN rows per ligand (CCD code), spread one per target
#     first: caps cofactors and the unflagged hubs (ANP, GNP, NAG, ...)
#   - dedup recomputed preferring the strict_rep row, then one row per
#     (PDB entry, ligand, UniProt) for symmetry copies
description: >
  dataset_v1 relaxed by the structure scan's gates (resolution, buried
  fragments, companion size) plus covalent, small-oligomer and cofactor
  ligands; glycosylation and detergents excluded; at most 50 train rows per
  ligand; dedup preferring strict_rep, then per (entry, ligand, UniProt).

manifest: data/meta/manifest.parquet
fingerprints: data/meta/ligand_fps.npy
join: [data/meta/structure_scan.parquet]

selection:
  splits: [train, val, test]
  # every build_manifest filter not relaxed above (HARD filters were applied
  # when the manifest was built)
  require: [pass_positions, pass_interactions, pass_single_ligand,
            pass_pocket_size, pass_crystal_contacts, pass_no_missing_pocket,
            pass_all_chains, pass_pocket_resolved]
  exclude: [ligand_is_detergent]
  # Folded scalar: keep every line at the same indent, or YAML keeps the
  # newlines and pandas rejects a multi-line query. x != x is a NaN test.
  query: >-
    (entry_resolution <= 3.5
    or (entry_resolution <= 4.5 and pocket_missing <= 2 and pocket_b_ratio <= 1.5))
    and ((ligand_molecular_weight >= 200 and ligand_molecular_weight <= 900)
    or (ligand_molecular_weight >= 120 and ligand_molecular_weight < 200
    and burial45 >= 0.9))
    and not (ligand_is_covalent == True and ligand_is_glycan)
    and (ligand_is_oligo != True or ligand_num_heavy_atoms <= 60)
    and (n_ligand_chains == 1 or comp_maxha_8 <= 6)
  dedup:
    - [pli_unique_qcov__95__strong__component, ligand_ccd_code]
    # UniProt in the key: the same ligand on two different proteins of one
    # complex is two examples, not a symmetry copy
    - [entry, ligand_ccd_code, system_pocket_UniProt]
  dedup_sort: ["-strict_rep", entry_resolution, system_id]
  cap:
    - {by: ligand_ccd_code, max: 50, spread: system_pocket_UniProt, splits: [train]}

receptor_input:
  policy: plinder_receptor
  params: {}
